<!--
  Netlify Forms detection stub.

  Netlify registers forms by scanning STATIC HTML at deploy time. The real
  contact form (src/components/Footer/ReactContactForm.tsx) is a React island
  and the site is SSR (output: "server"), so no static HTML contains a <form>
  for Netlify to find. This standalone file is copied verbatim from public/
  into the build output purely so Netlify can detect the "contact" form.

  It is never linked or shown to users. Keep the field `name` attributes in
  sync with the React form — any field missing here is dropped from submissions.
-->
<html>
  <head></head>
  <body>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
